    function logEvent(type,payload={}){const logs=JSON.parse(localStorage.getItem("spajin_ab_logs")||"[]");logs.push({timestamp:new Date().toISOString(),type,...payload});localStorage.setItem("spajin_ab_logs",JSON.stringify(logs.slice(-500)))}
    function exportLogs(){const logs=JSON.parse(localStorage.getItem("spajin_ab_logs")||"[]"),headers=["timestamp","type","variant","q1","q2","area","free_text_present","facility_id","guardian_id","score"],csv=[headers.join(","),...logs.map(r=>headers.map(h=>csvEscape(r[h]??"")).join(","))].join("\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`spajin-ab-log-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}
    function csvEscape(v){const t=String(v);return/[",\n\r]/.test(t)?`"${t.replace(/"/g,'""')}"`:t}
